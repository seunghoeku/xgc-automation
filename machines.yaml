# machines.yaml — HPC machine definitions (single source of truth)
# The hpc_runner tool reads this file to absorb scheduler/auth/path differences.
# Values written as <...> are placeholders and must be filled in for the real
# environment.

perlmutter:
  center: nersc
  host: perlmutter.nersc.gov
  user: sku
  auth:
    method: sshproxy            # run sshproxy once a day to issue a 24h key
    key_ttl_hours: 24
    ssh_config_host: perlmutter # alias supplies IdentityFile + CertificateFile
  scheduler:
    type: slurm
    submit: sbatch
    status: squeue
    cancel: scancel
    submit_tpl: templates/slurm.sbatch.j2
  paths:
    scratch: /pscratch/sd/s/sku
    run_root: /pscratch/sd/s/sku/xgc-runs
  xgc:
    # Access, Slurm, CPU compilation, login-node dryrun, and real CPU runs were
    # verified in the reduced-adiabatic campaign. Do not make that feature
    # branch the general automation default; select a production executable
    # explicitly after its commit and runtime environment are reviewed.
    exe: null
    modules: []
    observed_builds:
      reduced_adiabatic_cpu:
        exe: /pscratch/sd/s/sku/codex_work/XGC-Devel-reduced-adia/build_cpu/bin/xgc
        env_script: /pscratch/sd/s/sku/codex_work/XGC-Devel-reduced-adia/quickstart/modules_and_env/perlmutter_cpu.sh
        commit: 8a27511f53b0f5dcdbafb9b5c903586f28787d2d
        runtime_tested: true
  defaults:
    account: m499
    qos: debug
    constraint: cpu
    nodes: 1
    ntasks_per_node: 32
    cpus_per_task: 8
    walltime: "00:30:00"
    mail_type: BEGIN,END,FAIL
    mail_user: sku@pppl.gov

polaris:
  center: alcf
  host: polaris.alcf.anl.gov
  user: shku
  auth:
    method: ssh_tunnel          # local port forwarding + MFA
    local_port: 2222
    ssh_config_host: polaris4   # Polaris login node 4 ControlMaster alias
  scheduler:
    type: pbs
    submit: qsub
    status: qstat
    cancel: qdel
    submit_tpl: templates/polaris.pbs.j2
    system: polaris
    filesystems: home:grand
    verified:
      submit: true
      status: true
      output: true
      cancel: false
      job_id: 7301673.polaris-pbs-01.hsn.cm.polaris.alcf.anl.gov
  paths:
    scratch: /grand/TokamakProfile/shku
    run_root: /grand/TokamakProfile/shku/xgc-runs
  xgc:
    # This remains the last verified GCC 13 build. Upstream master now targets
    # the GCC 14/CUDA 12.8.1 toolchain recorded below; switch exe/build only
    # after a clean build and compute-node smoke test succeed.
    exe: /grand/TokamakProfile/shku/XGC-Devel/build/bin/xgc
    # xgca (neoclassical) built 2026-07-31 with cmake -DXGCA=ON, same build
    # dir/commit f805e6223. Compiled only -- no dryrun or runtime test yet.
    xgca_exe: /grand/TokamakProfile/shku/XGC-Devel/build/bin/xgca
    src: /grand/TokamakProfile/shku/XGC-Devel
    build: /grand/TokamakProfile/shku/XGC-Devel/build
    build_type: RelWithDebInfo
    env_script: /grand/TokamakProfile/shku/XGC-Devel/quickstart/modules_and_env/polaris.sh
    # This build is not linked with the Cray GTL library. Enabling
    # MPICH_GPU_SUPPORT_ENABLED would make MPI initialization abort.
    gpu_aware_mpi: false
    modules: []
    verified:
      configure: true
      compiled: true
      runtime_tested: false
      commit: 60bef3bcef9fdab9709cab43d52a28dd89d8cb6f
    target_toolchain:
      source_commit: f805e622307546a4cb29f7bd097bac70ae95eed0
      setup_commit: 7c3d278f24ff461843f58641ebb8ca8e621fea6f
      compiler: gcc14
      cuda: 12.8.1
      dependencies: /grand/TokamakProfile/hager/Software/install
      source: /grand/TokamakProfile/shku/XGC-Devel-gcc14
      build: /grand/TokamakProfile/shku/XGC-Devel-gcc14/build
      verified: false
  defaults:
    account: TokamakProfile
    # Four-node prototype jobs fit debug-scaling; prod requires at least 10.
    queue: debug-scaling
    nodes: 4
    ntasks_per_node: 4
    cpus_per_task: 16
    gpus_per_node: 4
    walltime: "01:00:00"

stellar:
  center: princeton
  host: stellar.princeton.edu
  user: seungku
  auth:
    method: ssh_controlmaster    # MFA (Duo): human authenticates once, socket reused
    ssh_config_host: stellar     # ~/.ssh/config alias (see common.ssh_multiplexing)
    mfa: true
  scheduler:
    type: slurm
    submit: sbatch
    status: squeue
    cancel: scancel
    submit_tpl: templates/slurm.sbatch.j2
  paths:
    scratch: /scratch/gpfs/seungku
    run_root: /scratch/gpfs/seungku/xgc-runs
  xgc:
    # Build procedure and the -O2 compiler crash: docs/build-stellar.md
    exe: /home/seungku/git/XGC-Devel/build/bin/xgc
    src: /home/seungku/git/XGC-Devel
    build_type: Release          # RelWithDebInfo crashes icpx 2024.2 — do not use
    env_script: /projects/XGC/STELLAR/Software/bin/set_up_xgc.stellar
    modules: []                  # env_script performs all module loads
    verified:
      commit: 39c5c89f           # XGC-Devel fix_comments, build verified 2026-07-28
      runtime_tested: true       # ecbc ran real physics on job 2888698 (2026-07-28)
  defaults:
    account: pppl
    partition: all               # all(491 nodes) / pppl(126) / gpu(7) / bigmem / serial
    nodes: 1
    walltime: "00:10:00"         # partition limit is 15-00:01:00

flux:
  center: pppl
  host: flux.pppl.gov            # internal network (172.16.99.52) — VPN/on-site required
  user: <pppl_username>
  auth:
    method: ssh_controlmaster
    ssh_config_host: flux
    mfa: true
  scheduler:
    type: <slurm|pbs>            # unconfirmed — do not submit until filled in
    submit: <sbatch|qsub>
    status: <squeue|qstat>
    cancel: <scancel|qdel>
    submit_tpl: templates/slurm.sbatch.j2
  paths:
    scratch: <path/to/scratch>
    run_root: <path/to/scratch>/xgc-runs
  xgc:
    exe: null
    modules: []
  defaults:
    account: <pppl_account>
    partition: <partition>
    nodes: 1
    walltime: "00:10:00"

# Shared settings
common:
  local:
    os_priority: [macos, linux]
    ssh_multiplexing:
      control_master: auto
      control_persist: "8h"
      control_path: "~/.ssh/cm-%r@%h:%p"
  data:
    pull_only_summaries: true   # never bulk-download; pull summaries only
    output_format: adios2       # .bp
