# machines.yaml — HPC machine definitions (committed, machine-universal facts)
#
# This file holds only what is true for EVERY user of a machine: hosts,
# schedulers, queue shapes, shared installs, data policies.
#
# Per-user bindings (username, account, scratch paths, personal XGC builds,
# ssh alias names) live in machines.local.yaml, which is gitignored. Copy
# machines.local.yaml.example, fill in your values, and keep it next to this
# file. Values written as <...> are placeholders; preflight reports any that
# are still unfilled, and submission is blocked until the blocking ones are.

perlmutter:
  center: nersc
  host: perlmutter.nersc.gov
  user: <nersc_username>
  auth:
    method: sshproxy            # run sshproxy once a day to issue a 24h key
    key_ttl_hours: 24
    # Alias supplies IdentityFile + CertificateFile. The transport multiplexes
    # over its own socket in ~/.ssh/xgc-cm/, never the user's ControlPath.
    ssh_config_host: <ssh_alias>
  scheduler:
    type: slurm
    submit: sbatch
    status: squeue
    cancel: scancel
    submit_tpl: templates/slurm.sbatch.j2
  paths:
    scratch: <pscratch_path>        # echo $PSCRATCH on a login node
    run_root: <pscratch_path>/xgc-runs
  xgc:
    # No general production executable is selected yet (see AGENTS.md).
    # Record your build under machines.local.yaml when you have one.
    exe: null
    modules: []
  defaults:
    account: <nersc_account>
    qos: debug
    constraint: cpu
    nodes: 1
    ntasks_per_node: 32
    cpus_per_task: 8
    walltime: "00:30:00"
    mail_type: BEGIN,END,FAIL
    mail_user: <email>

polaris:
  center: alcf
  host: polaris.alcf.anl.gov
  user: <alcf_username>
  auth:
    method: ssh_tunnel          # local port forwarding + MFA
    local_port: 2222
    ssh_config_host: <ssh_alias>  # a Polaris login-node ControlMaster alias
  scheduler:
    type: pbs
    submit: qsub
    status: qstat
    cancel: qdel
    submit_tpl: templates/polaris.pbs.j2
    system: polaris
    filesystems: home:grand
    verified:                   # live round trip 2026-07-30 (project history)
      submit: true
      status: true
      output: true
      cancel: false
      job_id: 7301673.polaris-pbs-01.hsn.cm.polaris.alcf.anl.gov
  paths:
    scratch: <project_or_scratch_path>   # e.g. /grand/<project>/<user>
    run_root: <project_or_scratch_path>/xgc-runs
  xgc:
    # Personal builds belong in machines.local.yaml. Build procedure and the
    # login-node GPU/NVML limitation: docs/build-polaris.md. See `dryrun`
    # below for how the input is validated on this machine.
    exe: null
    xgca_exe: null
    src: null
    build: null
    build_type: RelWithDebInfo
    env_script: null
    # Builds without the Cray GTL library must keep this false; enabling
    # MPICH_GPU_SUPPORT_ENABLED makes MPI initialization abort.
    gpu_aware_mpi: false
    modules: []
  # `xgc --dryrun` cannot run on a Polaris login node (CUDA build, no visible
  # GPU, NVML broken), so it does not gate submission here. The production job
  # is submitted first; if it has not started after start_grace_seconds, a
  # 1-node job runs the dryrun in parallel and its verdict is attached to the
  # run on the next status check. docs/workflow.md, "Dryrun".
  # `queues` are tried in order; a queue is skipped when the user already has
  # per_user jobs in it or when a 1-node job does not fit its size limits
  # (docs.alcf.anl.gov/polaris/running-jobs: debug 1-2 nodes <=1 h, one job
  # per user; debug-scaling 1-10 nodes <=1 h, one per user; preemptable 1-10
  # nodes, may be preempted, 20 queued per user; prod needs >= 10 nodes).
  dryrun:
    login_node: false
    nodes: 1
    walltime: "00:15:00"
    start_grace_seconds: 20
    queues:
      - {name: debug, max_nodes: 2, per_user: 1}
      - {name: debug-scaling, max_nodes: 10, per_user: 1}
      - {name: preemptable, max_nodes: 10, per_user: 20}
  defaults:
    account: <alcf_project>
    # Four-node prototype jobs fit debug-scaling; prod requires at least 10.
    queue: debug-scaling
    nodes: 4
    ntasks_per_node: 4
    cpus_per_task: 16
    gpus_per_node: 4
    walltime: "01:00:00"

aurora:
  center: alcf
  host: aurora.alcf.anl.gov
  user: <alcf_username>
  auth:
    method: ssh_controlmaster   # MFA (MobilePASS+): human authenticates once, socket reused
    ssh_config_host: <ssh_alias>  # an Aurora login ControlMaster alias
    mfa: true
  scheduler:
    type: pbs
    submit: qsub
    status: qstat
    cancel: qdel
    submit_tpl: templates/aurora.pbs.j2
    # pbsnodes advertises resources_available.system=aurora, but qsub rejects
    # it inside select= ("Resource invalid in select specification", 2026-09-09).
    # Kept for the PBS adapter's completeness check; the template does not emit it.
    system: aurora
    # Lustre "flare" (/lus/flare/projects) is the only filesystem jobs should
    # run from; home is a separate Lustre (gecko). daos_user is opt-in.
    filesystems: home:flare
    verified:                   # live XGC round trip 2026-09-09 (2 nodes, debug, 20 steps)
      submit: true
      status: true
      output: true
      cancel: false
      job_id: 8814507.aurora-pbs-0001.hostmgmt.cm.aurora.alcf.anl.gov
  paths:
    scratch: <project_path>          # /lus/flare/projects/<project>/<user>
    run_root: <project_path>/xgc-runs
  # Optional: run inside a DAOS POSIX container instead of flare
  # (docs.alcf.anl.gov/aurora/data-management/daos/daos-overview). A pool is
  # allocated per project by ALCF support; the container is created once with
  #   daos container create --type=POSIX --chunk-size=2097152 \
  #     --properties=rd_fac:3,ec_cell_sz:131072,cksum:crc32,srv_cksum:on \
  #     --file-oclass=EC_16P3G32 --dir-oclass=RP_4G1 <pool> <container>
  # The job asks PBS for daos_user_fs, mounts the container on every node with
  # launch-dfuse.sh at /tmp/<pool>/<container>, runs XGC there through the
  # libpil4dfs interception library (mpiexec --no-vni), and keeps input,
  # script, and logs in the flare case directory. Pool and container are
  # per-user bindings (machines.local.yaml); the rest are site facts.
  # Verified 2026-09-09 (job 8814705, ECBC smoke test, 2 nodes, rc=0).
  daos:
    pool: <daos_pool>
    container: <daos_container>
    filesystems_resource: daos_user_fs
    mount_root: /tmp
    modulefiles: /soft/modulefiles
    module: daos
    launch: launch-dfuse.sh
    interception_library: /usr/lib64/libpil4dfs.so
    tile_wrapper: /soft/daos/tools/scripts/gpu_tile_compact_LD_PRELOAD.sh
  xgc:
    # Intel oneAPI (icpx/ifx) + SYCL build; see the XGC-Devel quickstart
    # (cmake_configs/aurora.sh, modules_and_env/aurora.sh). Personal builds
    # belong in machines.local.yaml.
    exe: null
    xgca_exe: null
    src: null
    build: null
    build_type: RelWithDebInfo
    env_script: null
    # XGC's Aurora cmake config compiles with -DUSE_GPU_AWARE_MPI=On, so the
    # runtime must keep MPIR_CVAR_ENABLE_GPU=1. Set false only for a binary
    # built without it.
    gpu_aware_mpi: true
    modules: []
  # Same as Polaris: no dryrun on a UAN (no launcher); validated in parallel
  # by a 1-node job when the production job does not start at once. debug is
  # one job per user; debug-scaling needs 2 nodes, so capacity (1-16 nodes,
  # 5 queued per user) is the fallback for a 1-node dryrun.
  dryrun:
    login_node: false
    nodes: 1
    walltime: "00:15:00"
    start_grace_seconds: 20
    queues:
      - {name: debug, max_nodes: 2, per_user: 1}
      - {name: capacity, max_nodes: 16, per_user: 5}
  defaults:
    account: <alcf_project>
    # Aurora queues (docs.alcf.anl.gov/aurora/running-jobs-aurora):
    #   debug          1-2 nodes,    <= 1 h, one job per user
    #   debug-scaling  2-256 nodes,  <= 1 h, one job per user
    #   prod           >= 256 nodes, <= 24 h (routes to small/medium/large)
    #   capacity       1-16 nodes,   <= 7 days, 2 running / 5 queued per user
    # A small XGC test fits debug; multi-day production below 256 nodes must
    # use capacity, because prod rejects anything smaller.
    queue: debug
    nodes: 1
    ntasks_per_node: 12          # one MPI rank per GPU tile (6 PVC x 2 tiles)
    cpus_per_task: 16            # 8 physical cores + hyperthreads per rank
    gpus_per_node: 6
    walltime: "00:30:00"

stellar:
  center: princeton
  host: stellar.princeton.edu
  user: <princeton_username>
  auth:
    method: ssh_controlmaster    # MFA (Duo): human authenticates once, socket reused
    ssh_config_host: <ssh_alias> # ~/.ssh/config alias (see common.ssh_multiplexing)
    mfa: true
  scheduler:
    type: slurm
    submit: sbatch
    status: squeue
    cancel: scancel
    submit_tpl: templates/slurm.sbatch.j2
  paths:
    scratch: <scratch_path>          # e.g. /scratch/gpfs/<user>
    run_root: <scratch_path>/xgc-runs
  xgc:
    # Build procedure and the -O2 compiler crash: docs/build-stellar.md
    exe: null                    # personal build -> machines.local.yaml
    src: null
    build_type: Release          # RelWithDebInfo crashes icpx 2024.2 — do not use
    # Shared site install; the same for every stellar user:
    env_script: /projects/XGC/STELLAR/Software/bin/set_up_xgc.stellar
    # Interpreter new enough to import XGC's utils/input_gui (login default
    # python3 is 3.6). Shared venv, same for every stellar user:
    remote_python: /projects/XGC/STELLAR/Software/install/python-venv/bin/python3.12
    modules: []                  # env_script performs all module loads
  defaults:
    account: <slurm_account>     # e.g. pppl
    partition: all               # all(491 nodes) / pppl(126) / gpu(7) / bigmem / serial
    nodes: 1
    walltime: "00:10:00"         # partition limit is 15-00:01:00

flux:
  center: pppl
  host: flux.pppl.gov            # internal network (172.16.99.52) — VPN/on-site required
  user: <pppl_username>
  auth:
    method: ssh_controlmaster
    ssh_config_host: <ssh_alias>
    mfa: true
  scheduler:
    type: <slurm|pbs>            # unconfirmed — do not submit until filled in
    submit: <sbatch|qsub>
    status: <squeue|qstat>
    cancel: <scancel|qdel>
    submit_tpl: templates/slurm.sbatch.j2
  paths:
    scratch: <path/to/scratch>
    run_root: <path/to/scratch>/xgc-runs
  xgc:
    exe: null
    modules: []
  defaults:
    account: <pppl_account>
    partition: <partition>
    nodes: 1
    walltime: "00:10:00"

# Shared settings
common:
  local:
    os_priority: [macos, linux]
    ssh_multiplexing:
      control_master: auto
      control_persist: "8h"
      control_path: "~/.ssh/cm-%r@%h:%p"
  data:
    pull_only_summaries: true   # never bulk-download; pull summaries only
    output_format: adios2       # .bp
