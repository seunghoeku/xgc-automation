# machines.yaml — HPC machine definitions (single source of truth)
# The hpc_runner tool reads this file to absorb scheduler/auth/path differences.
# Values written as <...> are placeholders and must be filled in for the real
# environment.

perlmutter:
  center: nersc
  host: perlmutter-p1.nersc.gov
  user: <nersc_username>
  auth:
    method: sshproxy            # run sshproxy once a day to issue a 24h key
    key_path: ~/.ssh/nersc      # key generated by sshproxy
    key_ttl_hours: 24
    ssh_config_host: perlmutter # prefer a ~/.ssh/config alias with ControlMaster
  scheduler:
    type: slurm
    submit: sbatch
    status: squeue
    cancel: scancel
    submit_tpl: templates/perlmutter.sbatch.j2
  paths:
    scratch: $PSCRATCH
    run_root: $PSCRATCH/xgc-runs
  xgc:
    exe: <path/to/xgc-es>       # path to an already-built executable
    modules:                    # module load before running
      - PrgEnv-gnu
      - cray-hdf5-parallel
      - cudatoolkit
      - adios2
  defaults:
    account: <nersc_project>    # -A / --account
    qos: regular
    constraint: gpu
    nodes: 4
    walltime: "01:00:00"

polaris:
  center: alcf
  host: polaris.alcf.anl.gov
  user: <alcf_username>
  auth:
    method: ssh_tunnel          # local port forwarding + MFA
    local_port: 2222
    ssh_config_host: polaris    # ~/.ssh/config alias recommended
  scheduler:
    type: pbs
    submit: qsub
    status: qstat
    cancel: qdel
    submit_tpl: templates/polaris.pbs.j2
  paths:
    scratch: /eagle/<project>
    run_root: /eagle/<project>/xgc-runs
  xgc:
    exe: <path/to/xgc-es>
    modules:
      - PrgEnv-nvhpc
      - cray-hdf5-parallel
      - adios2
  defaults:
    account: <alcf_project>     # -A
    queue: prod
    nodes: 4
    walltime: "01:00:00"

stellar:
  center: princeton
  host: stellar.princeton.edu
  user: seungku
  auth:
    method: ssh_controlmaster    # MFA (Duo): human authenticates once, socket reused
    ssh_config_host: stellar     # ~/.ssh/config alias (see common.ssh_multiplexing)
    mfa: true
  scheduler:
    type: slurm
    submit: sbatch
    status: squeue
    cancel: scancel
    submit_tpl: templates/slurm.sbatch.j2
  paths:
    scratch: /scratch/gpfs/seungku
    run_root: /scratch/gpfs/seungku/xgc-runs
  xgc:
    # Build procedure and the -O2 compiler crash: docs/build-stellar.md
    exe: /home/seungku/git/XGC-Devel/build/bin/xgc
    src: /home/seungku/git/XGC-Devel
    build_type: Release          # RelWithDebInfo crashes icpx 2024.2 — do not use
    env_script: /projects/XGC/STELLAR/Software/bin/set_up_xgc.stellar
    modules: []                  # env_script performs all module loads
    verified:
      commit: 256c3098           # XGC-Devel master, build verified 2026-07-28
      runtime_tested: false      # execution not yet verified
  defaults:
    account: pppl
    partition: all               # all(491 nodes) / pppl(126) / gpu(7) / bigmem / serial
    nodes: 1
    walltime: "00:10:00"         # partition limit is 15-00:01:00

flux:
  center: pppl
  host: flux.pppl.gov            # internal network (172.16.99.52) — VPN/on-site required
  user: <pppl_username>
  auth:
    method: ssh_controlmaster
    ssh_config_host: flux
    mfa: true
  scheduler:
    type: <slurm|pbs>            # unconfirmed — do not submit until filled in
    submit: <sbatch|qsub>
    status: <squeue|qstat>
    cancel: <scancel|qdel>
    submit_tpl: templates/slurm.sbatch.j2
  paths:
    scratch: <path/to/scratch>
    run_root: <path/to/scratch>/xgc-runs
  xgc:
    exe: null
    modules: []
  defaults:
    account: <pppl_account>
    partition: <partition>
    nodes: 1
    walltime: "00:10:00"

# Shared settings
common:
  local:
    os_priority: [macos, linux]
    ssh_multiplexing:
      control_master: auto
      control_persist: "8h"
      control_path: "~/.ssh/cm-%r@%h:%p"
  data:
    pull_only_summaries: true   # never bulk-download; pull summaries only
    output_format: adios2       # .bp
