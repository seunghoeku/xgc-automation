# machines.yaml — HPC 머신 정의 (단일 소스)
# hpc_runner 툴이 이 파일을 읽어 스케줄러/인증/경로 차이를 흡수한다.
# <...> 로 표시된 값은 실제 환경에 맞게 채워야 함.

perlmutter:
  center: nersc
  host: perlmutter-p1.nersc.gov
  user: <nersc_username>
  auth:
    method: sshproxy            # 하루 1회 sshproxy로 24h 유효 key 발급
    key_path: ~/.ssh/nersc      # sshproxy가 생성하는 key
    key_ttl_hours: 24
    ssh_config_host: perlmutter # ~/.ssh/config 에 ControlMaster 설정된 alias 권장
  scheduler:
    type: slurm
    submit: sbatch
    status: squeue
    cancel: scancel
    submit_tpl: templates/perlmutter.sbatch.j2
  paths:
    scratch: $PSCRATCH
    run_root: $PSCRATCH/xgc-runs
  xgc:
    exe: <path/to/xgc-es>       # 이미 빌드된 실행파일 경로
    modules:                    # 실행 전 module load
      - PrgEnv-gnu
      - cray-hdf5-parallel
      - cudatoolkit
      - adios2
  defaults:
    account: <nersc_project>    # -A / --account
    qos: regular
    constraint: gpu
    nodes: 4
    walltime: "01:00:00"

polaris:
  center: alcf
  host: polaris.alcf.anl.gov
  user: <alcf_username>
  auth:
    method: ssh_tunnel          # 로컬 포트포워딩 + MFA
    local_port: 2222
    ssh_config_host: polaris    # ~/.ssh/config alias 권장
  scheduler:
    type: pbs
    submit: qsub
    status: qstat
    cancel: qdel
    submit_tpl: templates/polaris.pbs.j2
  paths:
    scratch: /eagle/<project>
    run_root: /eagle/<project>/xgc-runs
  xgc:
    exe: <path/to/xgc-es>
    modules:
      - PrgEnv-nvhpc
      - cray-hdf5-parallel
      - adios2
  defaults:
    account: <alcf_project>     # -A
    queue: prod
    nodes: 4
    walltime: "01:00:00"

stellar:
  center: princeton
  host: stellar.princeton.edu
  user: <princeton_netid>
  auth:
    method: ssh_controlmaster    # MFA(Duo) → 최초 1회 사람이 인증, 이후 소켓 재사용
    ssh_config_host: stellar     # ~/.ssh/config alias (아래 common.ssh_multiplexing 참조)
    mfa: true
  scheduler:
    type: slurm
    submit: sbatch
    status: squeue
    cancel: scancel
    submit_tpl: templates/slurm.sbatch.j2
  paths:
    scratch: /scratch/gpfs/<princeton_netid>
    run_root: /scratch/gpfs/<princeton_netid>/xgc-runs
  xgc:
    exe: null                    # 아직 빌드 없음 → hello-world 왕복 검증만
    modules: []
  defaults:
    account: <princeton_account>
    partition: <partition>       # 확인 필요 (예: all / gpu)
    nodes: 1
    walltime: "00:10:00"

flux:
  center: pppl
  host: flux.pppl.gov            # 내부망(172.16.99.52) — VPN/온사이트 필요
  user: <pppl_username>
  auth:
    method: ssh_controlmaster
    ssh_config_host: flux
    mfa: true
  scheduler:
    type: <slurm|pbs>            # 확인 필요 — 채우기 전 제출 금지
    submit: <sbatch|qsub>
    status: <squeue|qstat>
    cancel: <scancel|qdel>
    submit_tpl: templates/slurm.sbatch.j2
  paths:
    scratch: <path/to/scratch>
    run_root: <path/to/scratch>/xgc-runs
  xgc:
    exe: null
    modules: []
  defaults:
    account: <pppl_account>
    partition: <partition>
    nodes: 1
    walltime: "00:10:00"

# 공통 설정
common:
  local:
    os_priority: [macos, linux]
    ssh_multiplexing:
      control_master: auto
      control_persist: "8h"
      control_path: "~/.ssh/cm-%r@%h:%p"
  data:
    pull_only_summaries: true   # 전량 다운로드 금지, 요약만 pull
    output_format: adios2       # .bp
