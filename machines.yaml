# machines.yaml — HPC machine definitions (committed, machine-universal facts)
#
# This file holds only what is true for EVERY user of a machine: hosts,
# schedulers, queue shapes, shared installs, data policies.
#
# Per-user bindings (username, account, scratch paths, personal XGC builds,
# ssh alias names) live in machines.local.yaml, which is gitignored. Copy
# machines.local.yaml.example, fill in your values, and keep it next to this
# file. Values written as <...> are placeholders; preflight reports any that
# are still unfilled, and submission is blocked until the blocking ones are.

perlmutter:
  center: nersc
  host: perlmutter.nersc.gov
  user: <nersc_username>
  auth:
    method: sshproxy            # run sshproxy once a day to issue a 24h key
    key_ttl_hours: 24
    # Alias supplies IdentityFile + CertificateFile. The transport forces
    # ControlMaster=no and ControlPath=none for independent key connections.
    ssh_config_host: <ssh_alias>
  scheduler:
    type: slurm
    submit: sbatch
    status: squeue
    cancel: scancel
    submit_tpl: templates/slurm.sbatch.j2
  paths:
    scratch: <pscratch_path>        # echo $PSCRATCH on a login node
    run_root: <pscratch_path>/xgc-runs
  xgc:
    # No general production executable is selected yet (see AGENTS.md).
    # Record your build under machines.local.yaml when you have one.
    exe: null
    modules: []
  defaults:
    account: <nersc_account>
    qos: debug
    constraint: cpu
    nodes: 1
    ntasks_per_node: 32
    cpus_per_task: 8
    walltime: "00:30:00"
    mail_type: BEGIN,END,FAIL
    mail_user: <email>

polaris:
  center: alcf
  host: polaris.alcf.anl.gov
  user: <alcf_username>
  auth:
    method: ssh_tunnel          # local port forwarding + MFA
    local_port: 2222
    ssh_config_host: <ssh_alias>  # a Polaris login-node ControlMaster alias
  scheduler:
    type: pbs
    submit: qsub
    status: qstat
    cancel: qdel
    submit_tpl: templates/polaris.pbs.j2
    system: polaris
    filesystems: home:grand
    verified:                   # live round trip 2026-07-30 (project history)
      submit: true
      status: true
      output: true
      cancel: false
      job_id: 7301673.polaris-pbs-01.hsn.cm.polaris.alcf.anl.gov
  paths:
    scratch: <project_or_scratch_path>   # e.g. /grand/<project>/<user>
    run_root: <project_or_scratch_path>/xgc-runs
  xgc:
    # Personal builds belong in machines.local.yaml. Build procedure and the
    # login-node GPU/NVML limitation: docs/build-polaris.md. The dryrun must
    # run via a 1-node debug-queue job, not on a login node.
    exe: null
    xgca_exe: null
    src: null
    build: null
    build_type: RelWithDebInfo
    env_script: null
    # Builds without the Cray GTL library must keep this false; enabling
    # MPICH_GPU_SUPPORT_ENABLED makes MPI initialization abort.
    gpu_aware_mpi: false
    modules: []
  defaults:
    account: <alcf_project>
    # Four-node prototype jobs fit debug-scaling; prod requires at least 10.
    queue: debug-scaling
    nodes: 4
    ntasks_per_node: 4
    cpus_per_task: 16
    gpus_per_node: 4
    walltime: "01:00:00"

stellar:
  center: princeton
  host: stellar.princeton.edu
  user: <princeton_username>
  auth:
    method: ssh_controlmaster    # MFA (Duo): human authenticates once, socket reused
    ssh_config_host: <ssh_alias> # ~/.ssh/config alias (see common.ssh_multiplexing)
    mfa: true
  scheduler:
    type: slurm
    submit: sbatch
    status: squeue
    cancel: scancel
    submit_tpl: templates/slurm.sbatch.j2
  paths:
    scratch: <scratch_path>          # e.g. /scratch/gpfs/<user>
    run_root: <scratch_path>/xgc-runs
  xgc:
    # Build procedure and the -O2 compiler crash: docs/build-stellar.md
    exe: null                    # personal build -> machines.local.yaml
    src: null
    build_type: Release          # RelWithDebInfo crashes icpx 2024.2 — do not use
    # Shared site install; the same for every stellar user:
    env_script: /projects/XGC/STELLAR/Software/bin/set_up_xgc.stellar
    # Interpreter new enough to import XGC's utils/input_gui (login default
    # python3 is 3.6). Shared venv, same for every stellar user:
    remote_python: /projects/XGC/STELLAR/Software/install/python-venv/bin/python3.12
    modules: []                  # env_script performs all module loads
  defaults:
    account: <slurm_account>     # e.g. pppl
    partition: all               # all(491 nodes) / pppl(126) / gpu(7) / bigmem / serial
    nodes: 1
    walltime: "00:10:00"         # partition limit is 15-00:01:00

flux:
  center: pppl
  host: flux.pppl.gov            # internal network (172.16.99.52) — VPN/on-site required
  user: <pppl_username>
  auth:
    method: ssh_controlmaster
    ssh_config_host: <ssh_alias>
    mfa: true
  scheduler:
    type: <slurm|pbs>            # unconfirmed — do not submit until filled in
    submit: <sbatch|qsub>
    status: <squeue|qstat>
    cancel: <scancel|qdel>
    submit_tpl: templates/slurm.sbatch.j2
  paths:
    scratch: <path/to/scratch>
    run_root: <path/to/scratch>/xgc-runs
  xgc:
    exe: null
    modules: []
  defaults:
    account: <pppl_account>
    partition: <partition>
    nodes: 1
    walltime: "00:10:00"

# Shared settings
common:
  local:
    os_priority: [macos, linux]
    ssh_multiplexing:
      control_master: auto
      control_persist: "8h"
      control_path: "~/.ssh/cm-%r@%h:%p"
  data:
    pull_only_summaries: true   # never bulk-download; pull summaries only
    output_format: adios2       # .bp
