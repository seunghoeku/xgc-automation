[project]
name = "hpc-queue-monitor"
version = "0.1.0"
description = "Read-only Slurm/PBS queue monitoring with a SwiftBar menu for macOS"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["pyyaml>=6.0"]

[project.scripts]
hpc-monitor = "hpc_monitor.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hpc_monitor"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.md", "pyproject.toml", "SOURCE.json"]
