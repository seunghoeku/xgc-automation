# ECBC — reference case for the physics_advisor knowledge base.
#
# This is the first known-good XGC input in this project: it passes
# `xgc --dryrun` cleanly (no removed, no deprecated, no warnings) against
# XGC-Devel fix_comments @ 39c5c89f.
#
# Values here are recorded from the actual input file, not inferred.

name: ecbc
description: >
  ECBC electrostatic delta-f case. Core simulation (bounce=2), single toroidal
  mode family n=6, kinetic electrons and ions with ReducedDeltaF markers.

machine: stellar
case_dir: /home/seungku/tmp/test_ecbc
backup_dir: /home/seungku/tmp/test_ecbc.bak.20260728   # pre-migration original

validated:
  date: 2026-07-28
  xgc_commit: 39c5c89f
  input_md5: 91f972f2947148acc0248c9c6ee7688a
  dryrun: ACCEPTED           # 0 removed, 0 deprecated, 0 warnings
  n_ranks: 64
  runtime_tested: true       # job 2888698 reached the main loop and stepped

physics:
  model: electrostatic       # sml_em_* present but field model is electrostatic
  flavor: XGC1
  delta_f: true              # ptl_marker_type='ReducedDeltaF' for both species
  boundary: core             # sml_bounce=2, excludes open field lines
  species:
    - {name: electron, mass_au: 5.4545e-4, charge_eu: -1.0, marker: ReducedDeltaF}
    - {name: ion, mass_au: 1.0, charge_eu: 1.0, marker: ReducedDeltaF}
  toroidal_mode:
    n: 6                     # sml_mode_select_n{min,max}_real
    wedge_n: 6
    nphi_total: 8
  radial_domain:
    inpsi: 0.0               # sml_inpsi, units of eq_x_psi
    outpsi: 0.90

numerics:
  dt: 2.0e-4                 # sml_dt, toroidal transit times
  mstep: 10000
  num_per_vertex: [50, 50]
  f0_grid: {nmu: 44, nvp: 22, smu_max: 4.0, vp_max: 4.0}
  collisions: off            # col_mode=0

# Measured by xgc --dryrun at 64 ranks. Scales with rank count.
resource_estimate:
  n_ranks: 64
  memory_per_rank_gb: 0.146
  available_per_rank_gb: 375.9
  particles: 11375616
  vertices_5d: 220231616
  particles_per_vertex: 0.0517   # on target for ReducedDeltaF (~0.05)

# Measured from an actual run (job 2888698, 1 node / 8 ranks x 12 threads).
runtime_measured:
  date: 2026-07-28
  ranks: 8
  threads_per_rank: 12
  nodes: 1
  init_seconds: 166           # grid/field setup before the main loop
  seconds_per_step: 208       # from the "Performance History" line
  memory_per_rank_gb: 1.2     # steady state; the dryrun predicted 0.70
  note: >
    At this rank count a 50-step run needs ~3 h of stepping plus ~3 min of
    init, so it cannot fit a 10-minute walltime. Scale ranks up or steps down.
    The dryrun's memory estimate was ~40% low against the observed value.

# Reference: XGC writes both unit conventions to units.txt.
units_observed:
  sml_dt_input_tau: 2.0e-4    # what the input file contains
  sml_dt_seconds: 1.797e-8    # what XGC uses internally
  sml_tran_seconds: 8.986e-5  # toroidal transit time; the conversion factor

input_files:
  mesh:
    - ECBC_0.50_rhoi_mesh.eqd.node
    - ECBC_0.50_rhoi_mesh.eqd.ele
    - ECBC_0.50_rhoi_mesh.eqd.flx.aif
  equilibrium: ECBC_151x151.eqd
  geqdsk: geqdsk_ECBC_ITG_for_ECP_beta_0p25_FLOW
  profiles:
    density: ECBC_den_bet00p500.dat
    temp_electron: ECBC_te.dat
    temp_ion: ECBC_ti.dat
  other: [adios2cfg.xml, petsc.rc]

# Migration applied 2026-07-28 to make the case run on current XGC.
# The original is preserved in backup_dir.
migration:
  removed_parameters:        # blocking; XGC refused to start
    - {from: ptb_3db_on, to: sml_3db_on, note: "also moved to &sml_param"}
    - {from: sml_poisson_solver_type, to: null,
       note: "dropped; sml_iter_solver* already configures the solver"}
    - {from: sml_f0_grid_alpha, to: null, note: "dropped; was 0.0"}
    - {from: sml_f0_grid_alpha_start, to: null, note: "dropped; no longer used"}
    - {from: f0_update_analytic_alpha, to: f0_update_alpha, note: "renamed"}
  deprecated_parameters:     # accepted but obsolete; migrated for clarity
    - {from: [sml_deltaf, sml_deltaf_elec], to: ptl_marker_type,
       note: "replaced by ptl_marker_type='ReducedDeltaF' for both species"}
    - {from: sml_f0_grid, to: ptl_dynamic_f0,
       note: "dropped; ReducedDeltaF defaults dynamic_f0=false, matching full-f off"}
    - {from: sml_special, to: null, note: "dropped; was 0 (normal simulation)"}
    - {from: sml_em_pullback_mode, to: sml_em_pullback_method,
       note: "mode 4 maps to 'IdealMHD' (verified in sml.cpp:190)"}
    - {from: smooth_rad_efield, to: null, note: "dropped; smooth_r no longer exists"}

# Marker type was previously implicit. sml_deltaf/sml_deltaf_elec are inert in
# current XGC -- they appear only in the deprecation table and nothing reads
# them -- so the case was silently defaulting to TotalF. Declaring
# ReducedDeltaF restores the intended delta-f behavior and also brings
# weight_evo_eq=PDE and dynamic_f0=false by default.
notes:
  - "The dryrun's low-resolution warning disappeared after this change: 0.0517
     ptl/vertex is on target for ReducedDeltaF but ~100x short for TotalF."
  - "Collisions are off (col_mode=0)."
  - "sml_restart=.true., so a restart file is expected unless it is set false
     for a fresh run."
  - "At runtime XGC warns: 'Using split weight scheme (required for
     electrostatic simulation using ReducedDeltaF electrons). This operation
     mode is not yet validated.' This comes from XGC itself, not from our
     tooling. Worth confirming with the XGC team before trusting production
     results from this configuration."

# Deterministic matching evidence for tools/physics_advisor.py. Regex patterns
# are facts about the request language, not a source of new physics values.
advisor:
  minimum_match_signals: 2
  match_signals:
    - label: electrostatic
      patterns: ['\belectrostatic\b']
    - label: core domain
      patterns: ['\bcore\b']
    - label: reduced delta-f markers
      patterns: ['\breduced[\s-]*delta[\s-]*f\b', '\bdelta[\s-]*f\b']
    - label: ITG or core turbulence
      patterns: ['\bITG\b', '\bcore turbulence\b']
    - label: collisionless
      patterns: ['\bcollisionless\b', '\bcollisions?\s+off\b']
  exclusions:
    - label: electromagnetic
      patterns: ['\belectromagnetic\b']
      reason: ECBC is electrostatic, not electromagnetic
    - label: edge-SOL
      patterns: ['\bedge\b', '\bSOL\b', 'scrape[\s-]*off']
      reason: ECBC is a core case and excludes open field lines
    - label: ELM
      patterns: ['\bELM\b', 'edge[\s-]*localized']
      reason: ECBC is not an ELM baseline
    - label: enabled collisions
      patterns: ['\bcollisional\b', '\bcollisions?\s+(?:on|enabled|required)\b']
      reason: ECBC has collisions disabled
  baseline_parameters:
    ptl_marker_type: [ReducedDeltaF, ReducedDeltaF]
    sml_bounce: 2
    sml_mode_select_nmin_real: 6
    sml_mode_select_nmax_real: 6
    sml_wedge_n: 6
    sml_nphi_total: 8
    sml_inpsi: 0.0
    sml_outpsi: 0.90
    sml_dt: 2.0e-4
    col_mode: 0
  warnings:
    - >
      XGC reports that electrostatic ReducedDeltaF electrons use an unvalidated
      split-weight operating mode. Confirm with the XGC team before treating
      production results as trustworthy.
