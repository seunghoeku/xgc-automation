[project]
name = "xgc-automation"
version = "0.1.0"
description = "XGC 시뮬레이션 자동화 — 로컬 LLM 두뇌 + 원격 HPC 손발. opencode MCP 툴 계층."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.2.0",
    "pyyaml>=6.0",
    "asyncssh>=2.14",
    "jinja2>=3.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tools"]
