[project]
name = "xgc-automation"
version = "0.1.0"
description = "XGC simulation automation — local LLM brain + remote HPC hands. opencode MCP tool layer."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.2.0",
    "pyyaml>=6.0",
    "jinja2>=3.1",
    "openpyxl>=3.1.5",
]

[project.optional-dependencies]
# Google Sheets mirroring is optional: the catalog and its CLI work without it.
sheets = [
    "gspread>=6.0",
    "google-auth>=2.28",
]
# Mesh preview (docs/mesh-generation.md): draw node/ele files locally.
mesh = [
    "numpy>=1.26",
    "matplotlib>=3.8",
]
# Rotation-input matching loop (flow_match/README.md): local profile arithmetic.
flow-match = [
    "numpy>=1.26",
    "scipy>=1.11",
    "matplotlib>=3.8",
]

[project.scripts]
xgc-remote-gui = "tools.remote_gui:main"
xgc-sim = "tools.simcat_cli:main"
xgc-queue-watch = "tools.queue_watch:main"
# Optional non-Maxwellian f_init procedure (f_init/README.md); not part of the
# everyday flow, so it has its own package and entry point.
xgc-finit = "f_init.cli:main"
xgc-flowmatch = "flow_match.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tools", "f_init", "flow_match"]
