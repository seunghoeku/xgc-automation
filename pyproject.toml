[project]
name = "xgc-automation"
version = "0.1.0"
description = "XGC simulation automation — local LLM brain + remote HPC hands. opencode MCP tool layer."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.2.0",
    "pyyaml>=6.0",
    "jinja2>=3.1",
    "openpyxl>=3.1.5",
]

[project.scripts]
xgc-remote-gui = "tools.remote_gui:main"
xgc-sim = "tools.simcat_cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tools"]
